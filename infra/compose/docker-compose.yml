# Shared by the api and worker services, which run the same image against the same
# database and sandbox supervisor. Each merges it and adds only what it alone needs.
x-app-env: &app-env
  DATABASE_URL: postgres://${POSTGRES_USER:-tangow}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-tangow}
  DATA_DIR: /data
  SANDBOX_SUPERVISOR_URL: http://supervisor:7091
  WAKEUP_DRIVER: graphile
  SANDBOX_PROVIDER: docker
  # Optional egress proxy (Mainland / corporate). Empty = unset; either case works.
  HTTP_PROXY: ${HTTP_PROXY:-${http_proxy:-}}
  HTTPS_PROXY: ${HTTPS_PROXY:-${https_proxy:-}}
  NO_PROXY: ${NO_PROXY:-${no_proxy:-}}
  http_proxy: ${http_proxy:-${HTTP_PROXY:-}}
  https_proxy: ${https_proxy:-${HTTPS_PROXY:-}}
  no_proxy: ${no_proxy:-${NO_PROXY:-}}

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16}
    restart: unless-stopped
    environment:
      # USER/PASSWORD/DB apply only on first pgdata init. Keep existing values in
      # .env, or ALTER ROLE / rename in place. Recreate pgdata only after backup
      # (or when the volume is disposable); down -v deletes all DB state.
      POSTGRES_USER: ${POSTGRES_USER:-tangow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-tangow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tangow} -d ${POSTGRES_DB:-tangow}"]
      interval: 3s
      timeout: 5s
      retries: 20

  supervisor:
    image: tangow/supervisor:local
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: infra/sandboxes/supervisor/Dockerfile
    environment:
      DATA_DIR: /data
      SUPERVISOR_HOST: "0.0.0.0"
      SUPERVISOR_PORT: "7091"
      DOCKER_SOCKET: /var/run/docker.sock
      TANGOW_COMPUTER_IMAGE: tangow/computer:local
      TANGOW_WORKER_IMAGE: tangow/worker:local
      TANGOW_COMPUTER_MEMORY: ${TANGOW_COMPUTER_MEMORY:-8g}
      TANGOW_COMPUTER_CPUS: ${TANGOW_COMPUTER_CPUS:-4}
      TANGOW_COMPUTER_PIDS_LIMIT: ${TANGOW_COMPUTER_PIDS_LIMIT:-2048}
      SANDBOX_COMMAND_TIMEOUT_MS: ${SANDBOX_COMMAND_TIMEOUT_MS:-300000}
      SANDBOX_TEAM_SCREEN_LIMIT: ${SANDBOX_TEAM_SCREEN_LIMIT:-0}
      SANDBOX_SUPERVISOR_TOKEN: ${SANDBOX_SUPERVISOR_TOKEN:?Set SANDBOX_SUPERVISOR_TOKEN in .env}
      SANDBOX_SCREEN_NETWORK: isolated
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-}
      AXIOM_TOKEN: ${AXIOM_TOKEN:-}
      AXIOM_DATASET: ${AXIOM_DATASET:-}
      AXIOM_EDGE: ${AXIOM_EDGE:-}
      AXIOM_EDGE_URL: ${AXIOM_EDGE_URL:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../../data:/data
    depends_on:
      computer:
        condition: service_completed_successfully
      worker-image:
        condition: service_completed_successfully

  computer:
    image: tangow/computer:local
    build:
      context: ../sandboxes/computer
    command: ["true"]
    restart: "no"

  worker-image:
    image: tangow/worker:local
    build:
      context: ../..
      dockerfile: apps/agent-run-worker/Dockerfile
    command: ["true"]
    restart: "no"

  data-init:
    image: ${BUSYBOX_IMAGE:-busybox:1}
    command: ["chown", "-R", "1000:1000", "/data"]
    restart: "no"
    volumes:
      - ../../data:/data

  # Applies the migrations before the API and the worker start, writing the session log from the
  # legacy messages first when an upgrade needs it. On a large database that takes minutes. Then
  # moves each idle computer's home onto its volumes, on the same /data as the supervisor.
  migrate:
    image: tangow/app:local
    pull_policy: never
    command:
      - sh
      - -c
      - pnpm exec tsx scripts/backfill-session-log.ts && pnpm exec tsx scripts/migrate-docker-homes.ts
    restart: "no"
    environment:
      <<: *app-env
    volumes:
      - ../../data:/data
    depends_on:
      postgres:
        condition: service_healthy
      data-init:
        condition: service_completed_successfully

  api:
    restart: unless-stopped
    # One image for api, worker and web: same context, same Dockerfile, only the
    # command differs. Naming it here builds it once instead of leaving Compose to
    # derive a per-service tag and keep three copies of the same 6 GB image.
    # worker and web reuse this tag with `pull_policy: never`: no registry serves
    # `:local`, and this build is what puts it on the host.
    image: tangow/app:local
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
    command: ["pnpm", "--filter", "@tangow/api", "start"]
    env_file:
      - ../../.env
    environment:
      <<: *app-env
      API_HOST: "0.0.0.0"
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ../../data:/data
    depends_on:
      postgres:
        condition: service_healthy
      data-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

  worker:
    image: tangow/app:local
    restart: unless-stopped
    pull_policy: never
    command: ["pnpm", "--filter", "@tangow/worker", "start"]
    # Time for in-flight runs to release their workers and hand their run back before SIGKILL.
    stop_grace_period: 30s
    env_file:
      - ../../.env
    environment:
      <<: *app-env
      BETTER_AUTH_SECRET: ""
      SCREEN_PROXY_SECRET: ""
    volumes:
      - ../../data:/data
    depends_on:
      postgres:
        condition: service_healthy
      data-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

  web:
    image: tangow/app:local
    restart: unless-stopped
    pull_policy: never
    command: ["pnpm", "--filter", "@tangow/web", "preview", "--host", "0.0.0.0", "--port", "5173"]
    environment:
      API_PROXY_TARGET: http://api:3100
      SCREEN_PROXY_SECRET: ${SCREEN_PROXY_SECRET:?Set SCREEN_PROXY_SECRET in .env}
      TANGOW_HOST: ${TANGOW_HOST:-localhost}
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api

  # Cloudflare Tunnel: exposes the local stack on its public hostname without
  # opening a port on the host. Ingress (hostname -> http://web:5173) is
  # configured remotely in the Cloudflare dashboard; the token is all the
  # connector needs. Token lives in .env (gitignored) as CLOUDFLARE_TUNNEL_TOKEN,
  # never in this file.
  #
  # Opt-in through the `tunnel` profile: `docker compose --profile tunnel up`.
  # Interpolation stays optional so the stack still starts, and backup/restore
  # still run, on machines that never set the token; cloudflared refuses to run
  # with an empty one.
  cloudflared:
    profiles: [tunnel]
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    restart: unless-stopped
    depends_on:
      - web

volumes:
  pgdata:
